name: Watch Cars

on:
  workflow_dispatch:
    inputs:
      force_report:
        description: "Nahlasit i zname inzeraty (test)"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run watcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REPORT: ${{ github.event.inputs.force_report }}
        run: python watch_cars.py

      - name: Commit state file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state_sauto.json
          git diff --quiet --cached || git commit -m "update state"
          git push
